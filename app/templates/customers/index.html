{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Customers</h1>
  <a href="/customers/new" class="btn btn-brand">New customer</a>
</div>

<form method="get" action="/customers" class="mb-3">
  <div class="input-group">
    <input name="q" class="form-control" value="{{ q }}" placeholder="Search name, phone or email…" data-autofocus>
    <button class="btn btn-outline-secondary">Search</button>
    {% if q %}<a href="/customers" class="btn btn-outline-secondary">Clear</a>{% endif %}
  </div>
</form>

<div class="card shadow-sm">
  <table class="table table-hover mb-0">
    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr></thead>
    <tbody>
      {% for c in customers %}
      <tr>
        <td><a href="/customers/{{ c.id }}">{{ c.name }}</a></td>
        <td>{{ c.phone_raw or '' }}</td>
        <td>{{ c.email or '' }}</td>
        <td class="text-end"><a href="/customers/{{ c.id }}" class="btn btn-sm btn-outline-secondary">View</a></td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-muted text-center py-4">No customers found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
